# Render Blueprint for the API. Frontend goes to Vercel (see README).
services:
  - type: web
    name: diamond-price-api
    runtime: python
    rootDir: backend
    # TensorFlow needs roughly 1 GB of RAM; choose a plan with at least that.
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: ALLOWED_ORIGINS
        sync: false            # set to your Vercel URL, e.g. https://your-app.vercel.app
      - key: MODEL_OUTPUT_CURRENCY
        value: USD
      - key: FALLBACK_USD_INR
        value: "94.58"
      - key: FALLBACK_RATE_DATE
        value: "2026-11-04"
