<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Facet — AI diamond valuation in Indian rupees</title>
    <meta name="description" content="Estimate diamond prices in INR with a neural network trained on diamond characteristics." />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem("facet-theme") || "auto";
          var dark = t === "dark" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          document.documentElement.classList.toggle("dark", matchMedia("(prefers-color-scheme: dark)").matches);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
